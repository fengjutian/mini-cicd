name: Release
on: {push: {tags: ['v*']}}
permissions: {contents: write}
jobs:
  build:
    strategy: {matrix: {include: [{os: ubuntu-latest, goos: linux, arch: amd64}, {os: ubuntu-latest, goos: linux, arch: arm64}]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: npm ci && npm run build
        working-directory: apps/web
      - run: mkdir -p dist && GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/charlesfeng/mini-cicd/apps/server/internal/server.Version=${GITHUB_REF_NAME}" -o dist/minicicd-${{ matrix.goos }}-${{ matrix.arch }} ./apps/server/cmd/minicicd
      - run: sha256sum dist/* > dist/minicicd-${{ matrix.goos }}-${{ matrix.arch }}.sha256
      - uses: softprops/action-gh-release@v2
        with: {files: 'dist/*'}
