name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        working-directory: apps/web
        env: {MINICICD_E2E_DATA_DIR: '/tmp/minicicd-e2e-${{ github.run_id }}'}
      - run: go test -race ./...
      - run: sudo env PATH="$PATH" go test ./apps/server/internal/runneripc -run TestServerRunsAsUnprivilegedJobUser -v
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./apps/server/...
      - run: go build ./apps/server/cmd/minicicd
  ssh-private-repository:
    if: github.event_name == 'push' && secrets.SSH_TEST_REPOSITORY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go test -tags=integration ./apps/server/internal/gitops -run TestRealSSHPrivateRepository -v
        env:
          MINICICD_TEST_SSH_REPOSITORY: ${{ secrets.SSH_TEST_REPOSITORY }}
          MINICICD_TEST_SSH_PRIVATE_KEY: ${{ secrets.SSH_TEST_PRIVATE_KEY }}
          MINICICD_TEST_SSH_KNOWN_HOSTS: ${{ secrets.SSH_TEST_KNOWN_HOSTS }}
